    <text y="58" class="detail">S3 Object Storage</text>
    <text y="81" class="detail">Supabase (PostgreSQL)</text>
    <text y="104" class="detail">MongoDB</text>
  </g>

  <line x1="44" y1="414" x2="856" y2="414" class="rule" />
  <g transform="translate(44 449)">
    <text class="label">AI-ASSISTED DEVELOPMENT</text>
    <text x="428" class="body">Codex · Claude · Gemini</text>
  </g>
  <line x1="44" y1="480" x2="856" y2="480" class="rule" />

  <g transform="translate(44 519)">
    <text class="section">Initiatives</text>
    <text y="40" class="item">Microsoft Learn Student Ambassadors</text>
    <text y="65" class="initiative-role">Head of SWE Track</text>
    <text y="89" class="body">Technical sessions and workshops covering</text>
    <text y="110" class="body">backend and cloud systems.</text>
    <text x="428" y="40" class="item">Google Developer Groups on Campus</text>
    <text x="428" y="65" class="initiative-role">Backend Mentor</text>
    <text x="428" y="89" class="body">Developer tracks and hands-on materials</text>
    <text x="428" y="110" class="body">for Nile University students.</text>
    <text y="148" class="item">Samsung Innovation Campus</text>
