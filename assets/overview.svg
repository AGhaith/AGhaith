<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <!-- Apple Dark Surface -->
    <linearGradient id="appleSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0c0c0e" />
    </linearGradient>

    <!-- Subtle Hairline Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c2c2e" />
      <stop offset="50%" stop-color="#3a3a3c" />
      <stop offset="100%" stop-color="#2c2c2e" />
    </linearGradient>
  </defs>

  <style>
    .apple-label {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      fill: #2997ff;
    }
    .apple-name {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.8px;
      fill: #f5f5f7;
    }
    .apple-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      letter-spacing: -0.1px;
      fill: #86868b;
    }
    .col-header {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      fill: #6e6e73;
    }
    .col-headline {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.4px;
      fill: #f5f5f7;
    }
    .col-spec {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 12.5px;
      font-weight: 400;
      letter-spacing: -0.1px;
      fill: #a1a1a6;
    }
    .col-dim {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 11.5px;
      font-weight: 400;
      fill: #6e6e73;
    }
  </style>

  <!-- Container -->
  <rect width="900" height="300" rx="18" fill="url(#appleSurface)" stroke="url(#borderGrad)" stroke-width="1" />

  <!-- Header Section -->
  <g transform="translate(48, 44)">
    <text x="0" y="0" class="apple-label">ENGINEERING SPECIFICATION</text>
    <text x="0" y="36" class="apple-name">Ahmed Wesam</text>
    <text x="0" y="62" class="apple-subtitle">Backend architecture, modern client interfaces, and private infrastructure. Nile University.</text>
  </g>

  <!-- Divider Line -->
  <line x1="48" y1="134" x2="852" y2="134" stroke="#242426" stroke-width="1" />

  <!-- 4-Column Spec Grid -->
  <!-- Column 1: Backend -->
  <g transform="translate(48, 160)">
    <text x="0" y="0" class="col-header">BACKEND</text>
    <text x="0" y="26" class="col-headline">.NET Core</text>
    <text x="0" y="52" class="col-spec">C# 12</text>
    <text x="0" y="72" class="col-dim">Clean Architecture</text>
    <text x="0" y="90" class="col-dim">Enterprise APIs</text>
  </g>

  <!-- Hairline 1 -->
  <line x1="250" y1="150" x2="250" y2="265" stroke="#242426" stroke-width="1" />

  <!-- Column 2: Client -->
  <g transform="translate(280, 160)">
    <text x="0" y="0" class="col-header">FRONTEND</text>
    <text x="0" y="26" class="col-headline">React</text>
    <text x="0" y="52" class="col-spec">Next.js App Router</text>
    <text x="0" y="72" class="col-dim">Tailwind CSS</text>
    <text x="0" y="90" class="col-dim">TypeScript</text>
  </g>

  <!-- Hairline 2 -->
  <line x1="470" y1="150" x2="470" y2="265" stroke="#242426" stroke-width="1" />

  <!-- Column 3: Systems -->
  <g transform="translate(500, 160)">
    <text x="0" y="0" class="col-header">HOSTING</text>
    <text x="0" y="26" class="col-headline">Docker</text>
    <text x="0" y="52" class="col-spec">VPS Deployments</text>
    <text x="0" y="72" class="col-dim">Local Server Nodes</text>
    <text x="0" y="90" class="col-dim">Linux Environment</text>
  </g>

  <!-- Hairline 3 -->
  <line x1="680" y1="150" x2="680" y2="265" stroke="#242426" stroke-width="1" />

  <!-- Column 4: Storage -->
  <g transform="translate(710, 160)">
    <text x="0" y="0" class="col-header">STORAGE</text>
    <text x="0" y="26" class="col-headline">Cloudflare R2</text>
    <text x="0" y="52" class="col-spec">S3 Object Storage</text>
    <text x="0" y="72" class="col-dim">Supabase (PostgreSQL)</text>
    <text x="0" y="90" class="col-dim">MongoDB</text>
  </g>
</svg>
