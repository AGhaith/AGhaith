<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1285" width="900" height="1285" role="img" aria-labelledby="profile-title profile-description">
  <title id="profile-title">Ahmed Wesam | Engineering profile</title>
  <desc id="profile-description">Ahmed Wesam. Computer Science at Nile University, Sheikh Zayed, Cairo, Egypt. Backend architecture, modern client interfaces, and private infrastructure. Backend: .NET Core, C# 12, Clean Architecture, Enterprise APIs. Frontend: React, Next.js App Router, Tailwind CSS, TypeScript. Hosting: Docker, VPS Deployments, Local Server Nodes, Linux, Railway. Storage: Cloudflare R2, S3 Object Storage, Supabase PostgreSQL, MongoDB. Coding with AI agents: Codex, Claude, Gemini. Initiatives: Microsoft Learn Student Ambassadors, Head of SWE Track; Google Developer Groups on Campus, Backend Mentor; Samsung Innovation Campus, IoT Alumnus; Nile University Student Union, Head of the Technical Committee. Guides on github.com/AGhaith: GitHub-Guide, VS-Code-Guide, Google-Development-Group, educational-projects. Email: a.wesam2300@nu.edu.eg. LinkedIn: linkedin.com/in/ahmed-wesam. The original silver and slate emblem floats beside the introduction.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171e28" />
      <stop offset="0.6" stop-color="#0d121b" />
      <stop offset="1" stop-color="#101620" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#515e6a" stop-opacity=".65" />
      <stop offset="0.5" stop-color="#293441" stop-opacity=".5" />
      <stop offset="1" stop-color="#536776" stop-opacity=".5" />
    </linearGradient>
<linearGradient id="silver" x1="-60" y1="-65" x2="48" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1f6ee"/><stop offset=".5" stop-color="#bdcbd0"/><stop offset="1" stop-color="#748a99"/>
    </linearGradient>
<linearGradient id="slate" x1="-20" y1="-70" x2="65" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#758a99"/><stop offset="1" stop-color="#252e3e"/>
    </linearGradient>
<linearGradient id="cyan" x1="0" y1="-6" x2="0" y2="6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4f8ff"/><stop offset="1" stop-color="#71cce5"/>
    </linearGradient>
<radialGradient id="halo"><stop stop-color="#8fd5e7" stop-opacity=".12"/><stop offset="1" stop-color="#8fd5e7" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.7px; fill: #a3b3bf; }
    .name { font-size: 38px; font-weight: 600; letter-spacing: -1px; fill: #f5f5f7; }
    .intro { font-size: 15px; fill: #b0b0b8; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; fill: #a1a1aa; }
    .tech { font-size: 21px; font-weight: 600; letter-spacing: -0.5px; fill: #f5f5f7; }
    .detail { font-size: 13px; fill: #b0b0b8; }
    .section { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; fill: #f5f5f7; }
    .item { font-size: 15px; font-weight: 600; fill: #ededf0; }
    .body { font-size: 14px; fill: #b0b0b8; }
    .link { font-size: 12px; fill: #a9deeb; }
    .initiative-role { font-size: 17px; font-weight: 600; fill: #a9deeb; }
    .contact-label { font-size: 12px; fill: #a1a1aa; }
    .contact-value { font-size: 14px; fill: #ededf0; }
    .rule { stroke: #a4bdcc; stroke-opacity: .14; stroke-width: 1; }
    a { text-decoration: none; }
    a:hover text, a:focus text { fill: #79beff; }
    a:focus { outline: 2px solid #2997ff; outline-offset: 4px; }
    .emblem { animation: float 8s ease-in-out infinite; }
    .halo { animation: breathe 8s ease-in-out infinite; }
    .orbit { animation: orbit 28s linear infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .emblem, .halo, .orbit { animation: none; }
    }
  </style>

  <!-- A single continuous surface contains the complete profile. -->
  <rect x="0.5" y="0.5" width="899" height="1284" rx="22" fill="url(#surface)" stroke="url(#edge)" />

  <g transform="translate(44 44)">
    <text class="eyebrow">DEVELOPMENT &amp; COMMUNITY</text>
    <text y="44" class="name">Ahmed Wesam</text>
    <text y="75" class="intro">Backend architecture, modern client interfaces,</text>
    <text y="98" class="intro">and private infrastructure.</text>
    <text y="133" class="body">Computer Science at Nile University</text>
  </g>

  <line x1="44" y1="222" x2="856" y2="222" class="rule" />

  <!-- Original logo-inspired emblem and motion restored from the animated banner. -->
  <g transform="translate(750 126) scale(.88)" aria-hidden="true" fill="none">
    <circle class="halo" r="124" fill="url(#halo)"/>
    <circle r="96" stroke="#a6bfcb" stroke-opacity=".12"/>
    <g class="orbit"><circle cx="0" cy="-96" r="3" fill="#a9deeb"/></g>
    <g class="emblem">
      <rect x="-73" y="-73" width="146" height="146" rx="31" fill="#151e2b" stroke="#657988" stroke-opacity=".42"/>
      <path d="M0-60 A60 60 0 0 0-60 0 H0Z" fill="url(#silver)"/>
      <path d="M0-60 A60 60 0 0 1 60 0 H0Z" fill="url(#slate)"/>
      <path d="M-60 0 A60 60 0 0 0 0 60 V0Z" fill="url(#slate)"/>
      <path d="M0 0 H60 A60 60 0 0 1 0 60Z" fill="#202838"/>
      <path d="M0-60 A60 60 0 0 0-60 0" stroke="#ecf4ef" stroke-opacity=".55"/>
      <circle cx="-57" cy="-57" r="6" fill="#829eae"/>
      <g transform="translate(57 57)"><circle r="6" fill="url(#cyan)"/></g>
    </g>
  </g>

