    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171719" />
      <stop offset="1" stop-color="#0c0c0e" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#414145" />
      <stop offset="0.5" stop-color="#29292d" />
      <stop offset="1" stop-color="#343438" />
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.7px; fill: #2997ff; }
    .name { font-size: 38px; font-weight: 600; letter-spacing: -1px; fill: #f5f5f7; }
    .intro { font-size: 15px; fill: #b0b0b8; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; fill: #a1a1aa; }
    .tech { font-size: 21px; font-weight: 600; letter-spacing: -0.5px; fill: #f5f5f7; }
    .detail { font-size: 13px; fill: #b0b0b8; }
    .section { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; fill: #f5f5f7; }
    .item { font-size: 15px; font-weight: 600; fill: #ededf0; }
    .body { font-size: 14px; fill: #b0b0b8; }
    .link { font-size: 12px; fill: #2997ff; }
    .contact-label { font-size: 12px; fill: #a1a1aa; }
    .contact-value { font-size: 14px; fill: #ededf0; }
    .rule { stroke: #2b2b2f; stroke-width: 1; }
    a { text-decoration: none; }
    a:hover text, a:focus text { fill: #79beff; }
    a:focus { outline: 2px solid #2997ff; outline-offset: 4px; }
  </style>

