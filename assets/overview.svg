<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" width="900" height="1120" role="img" aria-labelledby="profile-title profile-description">
  <title id="profile-title">Ahmed Wesam | Engineering profile</title>
  <desc id="profile-description">Backend architecture, modern client interfaces, and private infrastructure. Computer Science at Nile University. Head of the SU Technical Committee. Sheikh Zayed, Cairo, Egypt. Stack: .NET Core, C# 12, Clean Architecture, Enterprise APIs, React, Next.js App Router, Tailwind CSS, TypeScript, Docker, VPS Deployments, Local Server Nodes, Linux, Cloudflare R2, S3 Object Storage, Supabase PostgreSQL, and MongoDB. Initiatives: Microsoft Learn Student Ambassador, Google Developer Groups on Campus, and Samsung Innovation Campus. Guides on github.com/AGhaith: GitHub-Guide, VS-Code-Guide, Google-Development-Group, and educational-projects. Email: a.wesam2300@nu.edu.eg. LinkedIn: linkedin.com/in/ahmed-wesam.</desc>
