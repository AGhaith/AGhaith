  <g transform="translate(44 253)">
    <text class="label">BACKEND</text>
    <text y="31" class="tech">.NET Core</text>
    <text y="58" class="detail">C# 12</text>
    <text y="81" class="detail">Clean Architecture</text>
    <text y="104" class="detail">Enterprise APIs</text>
